[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "behaviour-chemistry"
version = "0.1.0"
description = "Traceable behavioural priors for antifungal natural-product research"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "pandas>=2.2,<3", "numpy>=2,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
chemistry = ["rdkit>=2024.9"]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.setuptools.package-data]
"src.experiments" = ["viewer.html", "viewer.template.html", "browser_planner.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "ANN", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"
